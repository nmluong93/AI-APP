name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  android:
    name: YTDownloaderAndroid
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YTDownloaderAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-debug-apk
          path: YTDownloaderAndroid/app/build/outputs/apk/debug/*.apk

  macos:
    name: YTDownloader (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: YTDownloader
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
