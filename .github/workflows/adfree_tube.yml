name: AdFree Tube build

on:
  push:
    paths:
      - 'adfree_tube/**'
      - '.github/workflows/adfree_tube.yml'
  pull_request:
    paths:
      - 'adfree_tube/**'
      - '.github/workflows/adfree_tube.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: adfree_tube

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing with a throwaway debug key, so this APK can't update an earlier install."
          fi
      # Galaxy S23 and most phones since ~2017 are arm64, and many recent
      # ones can't run 32-bit apps at all, so ship one arm64 APK.
      - run: flutter build apk --release --target-platform android-arm64
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AdFreeTube.apk
      - uses: actions/upload-artifact@v4
        with:
          name: adfree-tube-android
          path: adfree_tube/build/app/outputs/flutter-apk/AdFreeTube.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent "AdFree Tube.app" AdFreeTube-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: adfree-tube-macos
          path: adfree_tube/build/macos/Build/Products/Release/AdFreeTube-macos.zip
