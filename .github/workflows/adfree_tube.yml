name: AdFree Tube build

on:
  push:
    paths:
      - 'adfree_tube/**'
      - '.github/workflows/adfree_tube.yml'
  # Every PR runs this workflow so the "AdFree Tube CI passed" check, which
  # main's ruleset requires, always reports; the changes job skips the real
  # work when the PR doesn't touch the app.
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: adfree_tube

# No APK or Mac app is built unless every test passes:
#   test    -> analyzer, Dart unit and widget tests (including real yt-dlp
#              downloads on Linux), and the page script tested in a real
#              browser on a YouTube-like page
#   render  -> the app on an Android emulator, checking from a screenshot
#              that the video actually shows (the black-video bug) and that
#              it keeps playing in the background and with the screen off
#   downloads-android -> the app on an Android emulator downloading a video
#              as MP4 and MP3 with its own yt-dlp and ffmpeg
#   macos-render -> the app on a Mac against the YouTube-like page, checking
#              that the video plays and plays on after seeking (and, for
#              information, the same on a real YouTube video)
#   android -> the APK, only after test, render and downloads-android pass
#   macos   -> the Mac app, only after test and macos-render pass
#   ci-ok   -> the one check main requires: fails if any job above failed
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'adfree_tube/**'
              - '.github/workflows/adfree_tube.yml'

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      # The desktop downloader's end-to-end tests run the real yt-dlp and
      # ffmpeg; REQUIRE_YTDLP makes them fail rather than skip if missing.
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --user -q yt-dlp
      - run: flutter test
        env:
          REQUIRE_YTDLP: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Page script browser test
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tool/page_script_test/test.mjs

  render:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # What ships: canvas drawing and the background fix on, in both
          # ways of embedding the WebView. These must pass.
          - { hybrid: true, canvas: true, bgfix: true }
          - { hybrid: false, canvas: true, bgfix: true }
          # For information only: without the canvas (the video shows on
          # the emulator but not on a Galaxy S23), and without the
          # background fix, to show the bug the fix is for.
          - { hybrid: true, canvas: false, bgfix: true, optional: true }
          - { hybrid: true, canvas: true, bgfix: false, optional: true }
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 40
    name: render (hybrid=${{ matrix.hybrid }}, canvas=${{ matrix.canvas }}, bgfix=${{ matrix.bgfix }})
    steps:
      - uses: actions/checkout@v4
      # The runner's disk is too full for the Flutter build plus an emulator
      # system image, so remove toolchains this job doesn't use.
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: pip install -q pillow
      # The test page is served over plain http from the runner.
      - run: sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: >
          flutter build apk --release --target-platform android-x64
          --dart-define=PLAYER_TEST=true
          --dart-define=PLAYER_TEST_URL=http://localhost:8000/youtube_like.html
          --dart-define=PLAYER_HYBRID=${{ matrix.hybrid }}
          --dart-define=PLAYER_CANVAS=${{ matrix.canvas }}
          --dart-define=PLAYER_BG_FIX=${{ matrix.bgfix }}
      # The Gradle daemon holds several GB of memory; the emulator needs it.
      - run: cd android && ./gradlew --stop
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: adfree_tube
          script: bash tool/render_test/run.sh

  downloads-android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft
          sudo docker image prune --all --force >/dev/null || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: >
          flutter build apk --release --target-platform android-x64
          --dart-define=DOWNLOAD_TEST_URL=http://localhost:8000/sample.mp4
      - run: cd android && ./gradlew --stop
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: adfree_tube
          script: bash tool/download_test/run_android.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloads-android-screenshot
          path: adfree_tube/tool/download_test/downloads.png
          if-no-files-found: ignore

  android:
    needs: [test, render, downloads-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Workaround (bug 2 in the adfree_tube README): without a fixed key every
      # build is signed differently and Android refuses to update over it.
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing with a throwaway debug key, so this APK can't update an earlier install."
          fi
      # Workaround (bug 1 in the adfree_tube README "Known bugs and workarounds"):
      # Galaxy S23 and most phones since ~2017 are arm64, and many recent
      # ones can't run 32-bit apps at all, so ship one arm64 APK.
      - run: flutter build apk --release --target-platform android-arm64
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AdFreeTube.apk
      - uses: actions/upload-artifact@v4
        with:
          name: adfree-tube-android
          path: adfree_tube/build/app/outputs/flutter-apk/AdFreeTube.apk

  macos-render:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow
      # The test page is served over plain http from the runner.
      - run: plutil -insert NSAppTransportSecurity -json '{"NSAllowsArbitraryLoads":true}' macos/Runner/Info.plist
      - run: flutter pub get
      - run: >
          flutter build macos --release
          --dart-define=PLAYER_TEST=true
          --dart-define=PLAYER_TEST_URL=http://127.0.0.1:8000/youtube_like.html
      # What ships: the canvas on. These must pass.
      - run: bash tool/render_test/run_macos.sh page-canvas http://127.0.0.1:8000/youtube_like.html true
      # Each scenario runs even if an earlier one failed, to compare them.
      - run: bash tool/render_test/run_macos.sh page-no-canvas http://127.0.0.1:8000/youtube_like.html false
        if: success() || failure()
      # For information: a real YouTube video, which has to be fetched after
      # each seek. YouTube can refuse CI machines, so these may not pass.
      - run: bash tool/render_test/run_macos.sh youtube-canvas https://m.youtube.com/watch?v=aqz-KE-bpKQ true
        if: success() || failure()
        continue-on-error: true
      - run: bash tool/render_test/run_macos.sh youtube-no-canvas https://m.youtube.com/watch?v=aqz-KE-bpKQ false
        if: success() || failure()
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-render-results
          path: adfree_tube/tool/render_test/out
          if-no-files-found: ignore

  macos:
    needs: [test, macos-render]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent "AdFree Tube.app" AdFreeTube-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: adfree-tube-macos
          path: adfree_tube/build/macos/Build/Products/Release/AdFreeTube-macos.zip

  ci-ok:
    name: AdFree Tube CI passed
    needs: [changes, test, render, downloads-android, android, macos-render, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        working-directory: .
        run: |
          echo "A required job failed or was cancelled."
          exit 1
