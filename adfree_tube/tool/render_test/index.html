<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0; background:#000">
  <!-- A solid green video; the app's player script stretches it to fill the
       view, like it does on YouTube. -->
  <video src="test.mp4" autoplay muted loop playsinline></video>
  <!-- An orange square above the video: if it shows up, the WebView itself
       is being drawn, whether or not the video is. -->
  <div style="position:fixed; left:0; top:0; width:25vw; height:25vh;
              background:rgb(255,140,0); z-index:2147483647"></div>
</body>
</html>
